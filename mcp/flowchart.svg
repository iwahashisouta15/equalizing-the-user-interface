<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">Alur kerja Equalizing the User Interface MCP</title>
  <desc id="desc">Diagram alur MCP client melalui stdio ke server lokal, lalu memilih ekstraksi token desain Figma atau pembuatan kontrak UI. Hasil ditinjau manusia dan tidak otomatis mengubah UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#233876"/><stop offset="1" stop-color="#465bc0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1c2d58" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6777ac"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1e2b4d}
      .title{font-size:34px;font-weight:750;fill:#fff}.subtitle{font-size:16px;fill:#e2e8ff}
      .card{fill:#fff;stroke:#dbe3f4;stroke-width:2;filter:url(#shadow)}
      .cardtitle{font-size:20px;font-weight:700}.body{font-size:15px;fill:#52617f}.small{font-size:13px;fill:#657391}
      .tag{font-size:12px;font-weight:700;letter-spacing:.5px}.arrow{fill:none;stroke:#6777ac;stroke-width:3;marker-end:url(#arrow)}
      .purple{fill:#eef0ff;stroke:#bfc7fa}.teal{fill:#e8f8f6;stroke:#a8e1d8}.amber{fill:#fff7e6;stroke:#f3d28b}.red{fill:#fff0ee;stroke:#f0b5ac}
    </style>
  </defs>
  <rect width="1400" height="1120" rx="24" fill="url(#bg)"/>
  <path d="M24 24 Q24 0 48 0 H1352 Q1376 0 1376 24 V150 H24Z" fill="url(#head)"/>
  <text x="700" y="64" text-anchor="middle" class="title">Flowchart — Equalizing the User Interface MCP</text>
  <text x="700" y="100" text-anchor="middle" class="subtitle">Dua tool untuk membaca desain dan menyiapkan kontrak; server bersifat read-only</text>

  <g>
    <rect x="475" y="184" width="450" height="84" rx="18" class="card"/>
    <text x="700" y="219" text-anchor="middle" class="cardtitle">MCP Client</text>
    <text x="700" y="245" text-anchor="middle" class="body">Pengguna memilih tool dan mengirim input</text>
    <path d="M700 268 V310" class="arrow"/>
    <rect x="475" y="316" width="450" height="96" rx="18" class="card purple"/>
    <text x="700" y="352" text-anchor="middle" class="cardtitle">MCP Server lokal · Node.js / TypeScript</text>
    <text x="700" y="380" text-anchor="middle" class="body">Transport stdio · validasi input · tidak menulis file</text>
    <path d="M700 412 V448" class="arrow"/>
    <polygon points="700,448 815,503 700,558 585,503" fill="#fff" stroke="#cbd4ed" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="498" text-anchor="middle" class="cardtitle" style="font-size:17px">Tool yang dipilih?</text>
    <text x="700" y="521" text-anchor="middle" class="small">Dua jalur terpisah</text>
  </g>

  <path d="M585 503 H350 V576" class="arrow"/>
  <path d="M815 503 H1050 V576" class="arrow"/>
  <text x="411" y="490" class="tag" fill="#4455b7">FIGMA</text>
  <text x="985" y="490" class="tag" fill="#168276">KONTRAK UI</text>

  <g>
    <rect x="75" y="582" width="550" height="74" rx="16" class="card purple"/>
    <text x="350" y="612" text-anchor="middle" class="cardtitle">figma_extract_design_tokens</text>
    <text x="350" y="637" text-anchor="middle" class="body">Input: file_key · token dari environment server</text>
    <path d="M350 656 V682" class="arrow"/>
    <rect x="75" y="688" width="550" height="78" rx="16" class="card"/>
    <text x="350" y="720" text-anchor="middle" class="cardtitle">Figma REST API · GET file</text>
    <text x="350" y="746" text-anchor="middle" class="body">Header autentikasi X-Figma-Token · timeout 15 detik</text>
    <path d="M350 766 V792" class="arrow"/>
    <rect x="75" y="798" width="550" height="78" rx="16" class="card"/>
    <text x="350" y="830" text-anchor="middle" class="cardtitle">Ekstrak nilai yang teramati</text>
    <text x="350" y="856" text-anchor="middle" class="body">Solid fills + properti tipografi dari document tree</text>
    <path d="M350 876 V902" class="arrow"/>
    <rect x="75" y="908" width="550" height="74" rx="16" class="card teal"/>
    <text x="350" y="938" text-anchor="middle" class="cardtitle">Hasil JSON → tinjau manual</text>
    <text x="350" y="963" text-anchor="middle" class="body">Bandingkan dengan desain sumber sebelum dipakai</text>
  </g>

  <g>
    <rect x="775" y="582" width="550" height="74" rx="16" class="card teal"/>
    <text x="1050" y="612" text-anchor="middle" class="cardtitle">ui_generate_contract</text>
    <text x="1050" y="637" text-anchor="middle" class="body">Tidak memerlukan kredensial provider AI</text>
    <path d="M1050 656 V682" class="arrow"/>
    <rect x="775" y="688" width="550" height="100" rx="16" class="card"/>
    <text x="1050" y="722" text-anchor="middle" class="cardtitle">Hasil kontrak TypeScript</text>
    <text x="1050" y="750" text-anchor="middle" class="body">ChatMessage · status · streaming · cancel</text>
    <text x="1050" y="773" text-anchor="middle" class="small">Provider-neutral · dikembalikan sebagai teks</text>
    <path d="M1050 788 V818" class="arrow"/>
    <rect x="775" y="824" width="550" height="100" rx="16" class="card amber"/>
    <text x="1050" y="859" text-anchor="middle" class="cardtitle">Developer meninjau &amp; mengadaptasi</text>
    <text x="1050" y="887" text-anchor="middle" class="body">Sesuaikan dengan kontrak UI yang sudah ada</text>
    <text x="1050" y="910" text-anchor="middle" class="small">Simpan/perubahan dilakukan secara manual</text>
    <path d="M1050 924 V951" class="arrow"/>
    <rect x="825" y="957" width="450" height="70" rx="16" class="card teal"/>
    <text x="1050" y="986" text-anchor="middle" class="cardtitle">Integrasi ke aplikasi — manual</text>
    <text x="1050" y="1010" text-anchor="middle" class="small">Tidak ada perubahan otomatis pada UI</text>
  </g>
  <rect x="215" y="1045" width="970" height="52" rx="15" class="card red"/>
  <text x="700" y="1078" text-anchor="middle" class="body" style="font-weight:700;fill:#9d453b">Batas keamanan: token hanya dari environment · tidak ada penulisan otomatis · tidak ada panggilan ke provider AI</text>
</svg>
